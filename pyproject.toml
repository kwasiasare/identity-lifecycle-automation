[project]
name = "identity-lifecycle-automation"
version = "0.1.0"
description = "Event-driven joiner/mover/leaver automation for Microsoft Entra + M365"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["identity_lifecycle", "tests"]
exclude = ["infra", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",
    "UP042",  # str+Enum (not StrEnum) is intentional: keeps pydantic/json serialization simple and explicit
]

[tool.ruff.lint.per-file-ignores]
# function_app.py MUST use typing.List (not the PEP 585 builtin `list`) inside
# func.Out[...]. The Azure Functions Python v2 worker indexes the app by
# reflecting over trigger parameter annotations, and it cannot resolve a
# builtin generic nested in func.Out[...] — that failure silently drops EVERY
# function in the app (the host reports "0 functions loaded" and never starts a
# Python worker). See README "Known issue (RESOLVED)". These ignores exist
# specifically so `ruff --fix` cannot reintroduce that outage.
"function_app.py" = ["UP006", "UP035"]

[tool.ruff.lint.isort]
known-first-party = ["identity_lifecycle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["identity_lifecycle", "function_app"]

[tool.coverage.report]
fail_under = 85
