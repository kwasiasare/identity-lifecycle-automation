name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint (ruff) + test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest -q --cov --cov-report=term-missing

  bicep-lint:
    name: Bicep build (lint + validate syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: az bicep build
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/parameters/dev.bicepparam --stdout > /dev/null
          az bicep build-params --file infra/parameters/prod.bicepparam --stdout > /dev/null
