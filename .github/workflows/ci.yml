name: CI

# Single workflow for lint/test/bicep-lint AND deploy — deliberately merged
# (rather than a separate deploy.yml) so the deploy jobs can declare a real
# `needs:` dependency on the quality gates and GitHub Actions enforces it:
# infra/code can never deploy off a commit that didn't pass lint+test+bicep
# lint, because the deploy job simply doesn't start otherwise.
#
# Auth: GitHub OIDC -> Entra federated credential (no client secrets stored in
# GitHub). Set up per README.md "EP-7: OIDC federation" — one federated
# credential per environment (dev, production) scoped to this repo + branch.
#
# Required environment-scoped variables (vars, not secrets — these are
# identifiers, not credentials) on each GitHub Environment (dev, production):
#   AZURE_CLIENT_ID        - app registration (user-assigned managed identity
#                             or app registration) client ID used for OIDC
#   AZURE_TENANT_ID         - Entra tenant ID
#   AZURE_SUBSCRIPTION_ID   - target subscription ID
#   AZURE_RESOURCE_GROUP    - resource group the stack deploys into
# The deploy-dev/deploy-prod jobs fail fast with a clear ::error:: annotation
# if any of these are unset on the environment, rather than failing deep
# inside `az login` with an opaque error.
#
# Nothing here runs until the repo is pushed to GitHub and these are
# configured — see the "Remaining TODOs" section of the README.

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint (ruff) + test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check .

      - name: Pytest (with coverage gate)
        run: python -m pytest -q --cov --cov-report=term-missing --cov-fail-under=85

  bicep-lint:
    name: Bicep build (lint + validate syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: az bicep build
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/parameters/dev.bicepparam --stdout > /dev/null
          az bicep build-params --file infra/parameters/prod.bicepparam --stdout > /dev/null

  what-if:
    name: Bicep what-if (dev)
    if: github.event_name == 'pull_request'
    needs: [lint-and-test, bicep-lint]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write # required for OIDC azure/login
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify required environment variables are set
        shell: bash
        run: |
          missing=0
          for var_name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP; do
            if [ -z "${!var_name}" ]; then
              echo "::error::Required variable $var_name is not set on the 'dev' GitHub Environment. Configure it under Settings > Environments > dev > Environment variables."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if against dev
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam \
            --name "idlc-whatif-${{ github.run_id }}-${{ github.run_attempt }}"

  deploy-dev:
    name: Deploy infra + code (dev)
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [lint-and-test, bicep-lint]
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      id-token: write # required for OIDC azure/login
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify required environment variables are set
        shell: bash
        run: |
          missing=0
          for var_name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP; do
            if [ -z "${!var_name}" ]; then
              echo "::error::Required variable $var_name is not set on the 'dev' GitHub Environment. Configure it under Settings > Environments > dev > Environment variables."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        id: infra
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/parameters/dev.bicepparam \
            --name "idlc-dev-${{ github.run_id }}-${{ github.run_attempt }}" \
            --query "properties.outputs.functionAppName.value" -o tsv > function_app_name.txt
          echo "function_app_name=$(cat function_app_name.txt)" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Deploy function code
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.infra.outputs.function_app_name }}
          package: "."
          scm-do-build-during-deployment: true

  deploy-prod:
    name: Deploy infra + code (production)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [lint-and-test, bicep-lint]
    runs-on: ubuntu-latest
    # The "production" GitHub Environment must have required-reviewer
    # protection configured so this job pauses for manual approval —
    # this is the "prod job gated on master" control, in addition to the
    # dev->test->approve->prod branch workflow itself and the `needs:` gate
    # on lint-and-test/bicep-lint above.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write # required for OIDC azure/login
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify required environment variables are set
        shell: bash
        run: |
          missing=0
          for var_name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP; do
            if [ -z "${!var_name}" ]; then
              echo "::error::Required variable $var_name is not set on the 'production' GitHub Environment. Configure it under Settings > Environments > production > Environment variables — deploy-prod refuses to proceed without all four."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if against production (recorded in logs before apply)
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/parameters/prod.bicepparam \
            --name "idlc-prod-whatif-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Deploy infrastructure
        id: infra
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/parameters/prod.bicepparam \
            --name "idlc-prod-${{ github.run_id }}-${{ github.run_attempt }}" \
            --query "properties.outputs.functionAppName.value" -o tsv > function_app_name.txt
          echo "function_app_name=$(cat function_app_name.txt)" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Deploy function code
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.infra.outputs.function_app_name }}
          package: "."
          scm-do-build-during-deployment: true
